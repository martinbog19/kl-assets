name: Update Logos

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # - name: Install dependencies
      #   run: |
      #     pip install --upgrade pip

      - name: Run update_logos.py
        run: |
          python update_logos.py
          if git status --porcelain | grep -q graphics/logos; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add graphics/logos
            git commit -m "Update logos"
            git push
          else
            echo "No logo updates found"
          fi
